[project]
name = "fundamentos-contabilidad"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8"]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm run build:web"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["engine", "backend"]
